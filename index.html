<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buffett Lens I Stock analysis tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f0f0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const CP = { v: 5, h: 8 };

    const C = {
      page:"#ffffff", hdr:"#3d8f62",
      border:"#c0c0c0",
      rowNum:"#e0e0e0", rowNumFg:"#555",
      colHdr:"#e0e0e0", colHdrFg:"#555",
      labelCol:"#f6f6f6", labelFg:"#2a2a2a",
      frozen:"#f6f6f6", frozenFg:"#888",
      input:"#ffffff", inputFg:"#1a1a1a",
      formula:"#e0e0e0", formulaFg:"#333",
      outGreen:"#3d8f62", outGreenFg:"#ffffff",
      outRed:"#bf5050", outRedFg:"#ffffff",
      blueCell:"#4470a8", blueCellFg:"#ffffff",
      ltxt:"#f6f6f6", ltxtFg:"#2a2a2a",
      selBorder:"#2563eb", selBg:"#dbeafe",
    };

    const G = { rowNum:38, colA:192, col:122, rowH:34, blankH:8, headerH:45, fbarH:34 };

    const COLS         = ["B","C","D","E","F"];
    const NAV          = ["A","B","C","D","E","F"];
    const DCOLS        = ["C","D","E","F"];
    const BLANKS       = new Set([5,9,16,20,24,28,33]);
    const TOTAL_W      = G.rowNum + G.colA + COLS.length * G.col;
    const ALL_ROWS     = Array.from({length:35}, (_, i) => i+1);
    const WC_PAIRS     = [["C","B"],["D","C"],["E","D"],["F","E"]];
    const MCAPEX_CELLS = new Set(["C15","D15","E15","F15"]);

    const INP = new Set([
      "F1",
      "C2","D2","E2","F2","C3","D3","E3","F3",
      "C6","D6","E6","F6","C7","D7","E7","F7","C8","D8","E8","F8",
      "B10","C10","D10","E10","F10",
      "B11","C11","D11","E11","F11",
      "B12","C12","D12","E12","F12",
      "C19","D19","E19","F19",
      "C30","D30","E30","F30","C31","D31","E31","F31",
      "B34",
    ]);
    const FRZ = new Set([
      "B2","B3","B4","B6","B7","B8","B14","B15",
      "B17","B18","B19","B21","B22","B23",
      "B25","B26","B27","B30","B31","B32",
    ]);
    const OUT  = new Set(["B35","D34","F34","D35","F35"]);
    const LTXT = new Set(["C34","E34","C35","E35"]);
    const BLUE = new Set(["F1","B34"]);
    const LTXT_V = {
      C34:"Latest OEPS Yield", E34:"Latest REPS Yield",
      C35:"Latest DPS Yield",  E35:"REPS Turnover",
    };

    const RLBL = {
      1:"FY", 2:"Face Value", 3:"Equity Capital · in crores", 4:"Total Shares · in crores",
      6:"PAT · in crores", 7:"Depreciation · in crores", 8:"Amortization · in crores",
      10:"Inventory · in crores", 11:"Trade Receivables · in crores", 12:"Trade Payables · in crores",
      13:"Net Working Capital · in crores", 14:"Δ Working Capital · in crores", 15:"Maintenance Capex · in crores",
      17:"Owner's Earnings · in crores", 18:"Retained Earnings · in crores", 19:"Dividend Payout · in crores",
      21:"Owner's Earnings Per Share", 22:"Retained Earnings Per Share", 23:"Dividend Per Share",
      25:"OEPS Yield", 26:"REPS Yield", 27:"DPS Yield",
      29:"CY", 30:"52W High Price", 31:"52W Low Price", 32:"Average Price",
      34:"CMP", 35:"Fair Value",
    };

    const R_YR  = new Set([1,29]);
    const R_INT = new Set([2,4,30,31,32]);
    const R_CR  = new Set([3,6,7,8,10,11,12,13,14,15,17,18,19]);
    const R_PS  = new Set([21,22,23]);
    const R_PCT = new Set([25,26,27]);

    function inSelRange(cr, sel, selEnd) {
      if (!selEnd) return cr === sel;
      const c=cr[0], r=parseInt(cr.slice(1)), ci=NAV.indexOf(c);
      const ci1=NAV.indexOf(sel[0]),   r1=parseInt(sel.slice(1));
      const ci2=NAV.indexOf(selEnd[0]),r2=parseInt(selEnd.slice(1));
      return ci>=Math.min(ci1,ci2)&&ci<=Math.max(ci1,ci2)&&r>=Math.min(r1,r2)&&r<=Math.max(r1,r2);
    }

    const EM   = "—";
    const fCr  = v => { if (v==null||isNaN(v)) return EM; const s=Math.round(Math.abs(v)).toLocaleString("en-US"); return v<0?`(${s})`:s; };
    const fPS  = v => (v==null||isNaN(v)) ? EM : Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    const fPct = v => (v==null||isNaN(v)) ? EM : `${(v*100).toFixed(2)}%`;
    const fYr  = v => (v==null||isNaN(v)) ? EM : Math.round(v).toString();
    const fInt = v => (v==null||isNaN(v)) ? EM : Math.round(Math.abs(v)).toLocaleString("en-US");
    const fRat = v => (v==null||isNaN(v)) ? EM : v.toFixed(2);

    function fmtCell(cr, v) {
      if (v==null||isNaN(v)) return EM;
      const r = parseInt(cr.slice(1));
      if (R_YR.has(r))  return fYr(v);
      if (R_INT.has(r)) return fInt(v);
      if (R_CR.has(r))  return fCr(v);
      if (R_PS.has(r))  return fPS(v);
      if (R_PCT.has(r)) return fPct(v);
      if (r===34) { const cl=cr[0]; return cl==="B" ? fInt(v) : fPct(v); }
      if (r===35) { const cl=cr[0]; return cl==="B" ? fPS(v)  : cl==="D" ? fPct(v) : fRat(v); }
      return String(v);
    }

    const FDS = (() => {
      const PREV = { C:"B", D:"C", E:"D", F:"E" };
      const NEXT = { B:"C", C:"D", D:"E", E:"F" };
      const m = {};
      ["B","C","D","E"].forEach(c => { m[`${c}1`] = `=${NEXT[c]}1-1`; });
      DCOLS.forEach(c => {
        const p = PREV[c];
        m[`${c}4`]  = `=${c}3/${c}2`;
        m[`${c}14`] = `=${c}13-${p}13`;
        m[`${c}17`] = `=${c}6+${c}7+${c}8-${c}14-${c}15`;
        m[`${c}18`] = `=${c}17+${c}19`;
        m[`${c}21`] = `=${c}17/${c}4`;
        m[`${c}22`] = `=${c}18/${c}4`;
        m[`${c}23`] = `=ABS(${c}19)/${c}4`;
        m[`${c}25`] = `=${c}21/${c}$32`;
        m[`${c}26`] = `=${c}22/${c}$32`;
        m[`${c}27`] = `=${c}23/${c}$32`;
        m[`${c}32`] = `=AVERAGE(${c}30:${c}31)`;
      });
      COLS.forEach(c => {
        m[`${c}13`] = `=${c}10+${c}11-${c}12`;
        m[`${c}29`] = `=${c}1-1`;
      });
      m.D34 = "=F21/B34";  m.F34 = "=F22/B34";
      m.D35 = "=F23/B34";
      m.F35 = "=(F32-C32)/SUM(C22:F22)";
      m.B35 = "=NPV(AVERAGE(C26:F26)*150%,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^1,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^2,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^3,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^4,(AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^5)+((AVERAGE(C21:F21)*(1+AVERAGE(C26:F26))^5)*(1/AVERAGE(C25:F25))))";
      return m;
    })();

    // inp passed so formula bar shows blank for empty input cells (not 0)
    function getFormula(cr, data, inp={}) {
      if (!cr) return "";
      const row = parseInt(cr.slice(1));
      if (LTXT.has(cr))    return LTXT_V[cr];
      if (FRZ.has(cr))     return "";
      if (BLANKS.has(row)) return "";
      if (cr[0] === "A")   return RLBL[row] || "";
      if (FDS[cr])         return FDS[cr];
      if (INP.has(cr))     return inp[cr] != null ? String(inp[cr]) : "";
      return "";
    }

    const a4  = (a, b, c, d) => (a + b + c + d) / 4;
    const EPS = 0.005;

    function outStyle(cr, data) {
      const grn = { bg:C.outGreen, fg:C.outGreenFg };
      const red = { bg:C.outRed,   fg:C.outRedFg   };
      const neu = { bg:C.formula,  fg:C.formulaFg  };
      const cmp = (lat, avg) => {
        if (lat==null||isNaN(lat)) return neu;
        return lat > avg*(1+EPS) ? grn : lat < avg*(1-EPS) ? red : neu;
      };
      if (cr==="B35") {
        const fv=data.B35, b34=data.B34;
        return (fv==null||isNaN(fv)||b34==null) ? grn : b34<=fv ? grn : red;
      }
      if (cr==="D34") return cmp(data.D34, a4(data.C25,data.D25,data.E25,data.F25));
      if (cr==="F34") return cmp(data.F34, a4(data.C26,data.D26,data.E26,data.F26));
      if (cr==="D35") return cmp(data.D35, a4(data.C27,data.D27,data.E27,data.F27));
      if (cr==="F35") { const v=data.F35; return (v==null||isNaN(v)) ? neu : v>1.001 ? grn : v<0.999 ? red : neu; }
      return grn;
    }

    // Empty by default — calc() normalises undefined → 0 internally
    const DEFS = {};

    function calc(inp, mult=150, mcapex=75) {
      const v = {};
      [...INP].forEach(k => { v[k] = inp[k] ?? 0; });
      v.E1=v.F1-1; v.D1=v.E1-1; v.C1=v.D1-1; v.B1=v.C1-1;
      DCOLS.forEach(c => { v[`${c}4`]=v[`${c}3`]/v[`${c}2`]; });
      COLS.forEach(c  => { v[`${c}13`]=v[`${c}10`]+v[`${c}11`]-v[`${c}12`]; });
      WC_PAIRS.forEach(([cu,pr]) => { v[`${cu}14`]=v[`${cu}13`]-v[`${pr}13`]; });
      DCOLS.forEach(c => {
        v[`${c}15`] = (mcapex/100)*v[`${c}7`];
        v[`${c}17`] = v[`${c}6`]+v[`${c}7`]+v[`${c}8`]-v[`${c}14`]-v[`${c}15`];
        v[`${c}18`] = v[`${c}17`]+v[`${c}19`];
        v[`${c}21`] = v[`${c}17`]/v[`${c}4`];
        v[`${c}22`] = v[`${c}18`]/v[`${c}4`];
        v[`${c}23`] = Math.abs(v[`${c}19`])/v[`${c}4`];
        v[`${c}32`] = (v[`${c}30`]+v[`${c}31`])/2;
        v[`${c}25`] = v[`${c}21`]/v[`${c}32`];
        v[`${c}26`] = v[`${c}22`]/v[`${c}32`];
        v[`${c}27`] = v[`${c}23`]/v[`${c}32`];
      });
      COLS.forEach(c => { v[`${c}29`]=v[`${c}1`]-1; });
      v.D34=v.F21/v.B34; v.F34=v.F22/v.B34;
      v.D35=v.F23/v.B34;
      v.F35=(v.F32-v.C32)/(v.C22+v.D22+v.E22+v.F22);
      const aR  = a4(v.C26,v.D26,v.E26,v.F26);
      const aD  = a4(v.C23,v.D23,v.E23,v.F23);
      const aO  = a4(v.C21,v.D21,v.E21,v.F21);
      const aOY = a4(v.C25,v.D25,v.E25,v.F25);
      const r=aR*(mult/100), g=aR;
      v.B35 = [1,2,3,4].reduce((s,i) => s + aD*(1+g)**i/(1+r)**i, 0)
            + (aD*(1+g)**5 + aO*(1+g)**5/aOY) / (1+r)**5;
      return v;
    }

    function parseN(s) {
      const t = String(s).trim().replace(/,/g,"").replace(/%/g,"");
      if (/^\([\d.]+\)$/.test(t)) return -parseFloat(t.slice(1,-1));
      return parseFloat(t);
    }

    function RowLabel({row}) {
      const lbl = RLBL[row] || "";
      const idx  = lbl.indexOf(" · in crores");
      if (idx === -1) return lbl;
      return <>{lbl.slice(0, idx)}<span style={{color:C.border}}>{lbl.slice(idx)}</span></>;
    }

    const TH_BASE = {
      padding:`${CP.v}px ${CP.h}px`,
      background:C.colHdr, color:C.colHdrFg,
      fontWeight:400, fontSize:11,
      borderRight:`1px solid ${C.border}`,
      borderBottom:`1px solid ${C.border}`,
      userSelect:"none", whiteSpace:"nowrap",
      height:G.rowH, boxSizing:"border-box", textAlign:"center",
    };

    function App() {
      const scrollRef    = useRef(null);
      const startCharRef    = useRef(null);  // char that triggered edit mode, or null
      const explicitEditRef = useRef(false); // true = Enter/dblclick, false = typed char
      const [inp,      setInp]      = useState(DEFS);
      const [sel,      setSel]      = useState("A1");
      const [selEnd,   setSelEnd]   = useState(null);
      const [editMode, setEditMode] = useState(false);
      const handleSelect = (cr, shift=false) => {
        if (shift && sel) setSelEnd(cr);
        else { setSel(cr); setSelEnd(null); }
      };
      const [draft,    setDraft]    = useState("");
      const [mult,     setMult]     = useState(150);
      const [mcapex,   setMcapex]   = useState(75);
      const fbarInputRef  = useRef(null);
      const fbarFocusRef  = useRef(false);
      const fbarActionRef = useRef(null);
      const dataRef   = useRef(null);
      const inpRef    = useRef(null);
      const selRef    = useRef(null);
      const selEndRef = useRef(null);
      const data = useMemo(() => calc(inp, mult, mcapex), [inp, mult, mcapex]);
      dataRef.current   = data;
      inpRef.current    = inp;
      selRef.current    = sel;
      selEndRef.current = selEnd;

      const histRef = useRef([{ inp: DEFS, sel: "A1", selEnd: null }]);
      const histIdx = useRef(0);
      const setInpH = fn => {
        setInp(prev => {
          const next = typeof fn === 'function' ? fn(prev) : fn;
          histRef.current = histRef.current.slice(0, histIdx.current + 1);
          histRef.current.push({ inp: next, sel: selRef.current, selEnd: selEndRef.current });
          histIdx.current = histRef.current.length - 1;
          return next;
        });
      };
      const undo = () => {
        if (histIdx.current <= 0) return;
        histIdx.current--;
        const h = histRef.current[histIdx.current];
        setInp(h.inp); setSel(h.sel); setSelEnd(h.selEnd);
      };
      const redo = () => {
        if (histIdx.current >= histRef.current.length - 1) return;
        histIdx.current++;
        const h = histRef.current[histIdx.current];
        setInp(h.inp); setSel(h.sel); setSelEnd(h.selEnd);
      };
      const upd = (cr, n) => { if (!isNaN(n)) setInpH(p => ({ ...p, [cr]: n })); };
      const clr = cr => setInpH(p => { const n={...p}; delete n[cr]; return n; });

      const exitEdit    = () => setEditMode(false);
      const tabFromCell = cr => {
        setEditMode(false);
        const ci = NAV.indexOf(cr[0]);
        const nc = NAV[Math.min(ci+1, NAV.length-1)];
        if (nc !== cr[0]) { setSel(`${nc}${parseInt(cr.slice(1))}`); setSelEnd(null); }
      };
      const enterFromCell = cr => {
        setEditMode(false);
        const nr = Math.min(parseInt(cr.slice(1)) + 1, 35);
        setSel(`${cr[0]}${nr}`);
        setSelEnd(null);
      };
      const navigateFromCell = (cr, dir) => {
        setEditMode(false);
        const col=cr[0], row=parseInt(cr.slice(1)), ci=NAV.indexOf(col);
        let nc=col, nr=row;
        if (dir==="ArrowRight") nc=NAV[Math.min(ci+1,NAV.length-1)];
        if (dir==="ArrowLeft")  nc=NAV[Math.max(ci-1,0)];
        if (dir==="ArrowDown")  nr=Math.min(row+1,35);
        if (dir==="ArrowUp")    nr=Math.max(row-1,1);
        setSel(`${nc}${nr}`);
        setSelEnd(null);
      };

      // Auto-scroll to keep sel in view
      useEffect(() => {
        if (!scrollRef.current) return;
        const target = selEnd || sel;
        if (!target) return;
        const row = parseInt(target.slice(1));
        let top = G.rowH;
        for (let r = 1; r < row; r++) top += BLANKS.has(r) ? G.blankH : G.rowH;
        const h = BLANKS.has(row) ? G.blankH : G.rowH;
        const c = scrollRef.current;
        if (top - G.rowH < c.scrollTop) c.scrollTop = Math.max(0, top - G.rowH);
        else if (top + h > c.scrollTop + c.clientHeight) c.scrollTop = top + h - c.clientHeight;
      }, [sel, selEnd]);

      // Focus formula bar input when edit was triggered by clicking the formula bar
      useEffect(() => {
        if (!editMode || !fbarFocusRef.current) return;
        const t = setTimeout(() => {
          if (fbarInputRef.current && fbarFocusRef.current) {
            fbarInputRef.current.focus();
            const len = fbarInputRef.current.value.length;
            fbarInputRef.current.setSelectionRange(len, len);
            fbarFocusRef.current = false;
          }
        }, 0);
        return () => clearTimeout(t);
      }, [editMode]);

      // Global paste handler (select mode)
      useEffect(() => {
        const onPaste = e => {
          if (editMode || !sel) return;
          if (e.target && e.target.tagName === "INPUT" && !e.target.readOnly) return;
          const txt = e.clipboardData.getData("text");
          if (!txt.trim()) return;
          e.preventDefault();
          const rows = txt.trim().split(/\r?\n/);
          const isMulti = rows.length > 1 || rows[0].includes("\t");
          if (isMulti) {
            const sc0 = selEnd ? Math.min(NAV.indexOf(sel[0]),NAV.indexOf(selEnd[0])) : NAV.indexOf(sel[0]);
            const sr0 = selEnd ? Math.min(parseInt(sel.slice(1)),parseInt(selEnd.slice(1))) : parseInt(sel.slice(1));
            const startCol = NAV[sc0];
            if (!COLS.includes(startCol)) return;
            const sc = COLS.indexOf(startCol);
            setInpH(p => {
              const n={...p};
              rows.forEach((row,ri) => row.split("\t").forEach((cell,ci) => {
                const cr=`${COLS[sc+ci]}${sr0+ri}`;
                if (INP.has(cr)) { const v=parseN(cell); if (!isNaN(v)) n[cr]=v; }
              }));
              return n;
            });
          } else {
            const v = parseN(txt.trim());
            if (isNaN(v)) return;
            setInpH(p => {
              const n={...p};
              if (selEnd) {
                NAV.forEach(c => ALL_ROWS.forEach(r => {
                  const cr=`${c}${r}`;
                  if (INP.has(cr) && inSelRange(cr,sel,selEnd)) n[cr]=v;
                }));
              } else {
                if (INP.has(sel)) n[sel]=v;
              }
              return n;
            });
          }
        };
        window.addEventListener("paste", onPaste);
        return () => window.removeEventListener("paste", onPaste);
      }, [sel, editMode, selEnd]);

      // Global keyboard handler
      useEffect(() => {
        const onKey = e => {
          if (!sel) return;

          // ── Edit mode: intercept Enter and Tab ──
          if (editMode) {
            if (e.key === "Enter") {
              e.preventDefault();
              setEditMode(false);
              const nr = Math.min(parseInt(sel.slice(1)) + 1, 35);
              setSel(`${sel[0]}${nr}`); setSelEnd(null);
              return;
            }
            if (e.key === "Tab") {
              e.preventDefault();
              setEditMode(false);
              const ci = NAV.indexOf(sel[0]);
              const nc = NAV[Math.min(ci+1, NAV.length-1)];
              if (nc !== sel[0]) { setSel(`${nc}${parseInt(sel.slice(1))}`); setSelEnd(null); }
            }
            return; // all other keys handled by the focused input
          }

          // ── Selected mode ──
          const col = sel[0], row = parseInt(sel.slice(1)), ci = NAV.indexOf(col);

          if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
            e.preventDefault();
            if (e.shiftKey) {
              const base=selEnd||sel, bc=base[0], br=parseInt(base.slice(1)), bci=NAV.indexOf(bc);
              let nc=bc, nr=br;
              if (e.key==="ArrowRight") nc=NAV[Math.min(bci+1, NAV.length-1)];
              if (e.key==="ArrowLeft")  nc=NAV[Math.max(bci-1, 0)];
              if (e.key==="ArrowDown")  nr=Math.min(br+1, 35);
              if (e.key==="ArrowUp")    nr=Math.max(br-1, 1);
              setSelEnd(`${nc}${nr}`);
            } else {
              let nc=col, nr=row;
              if (e.key==="ArrowRight") nc=NAV[Math.min(ci+1, NAV.length-1)];
              if (e.key==="ArrowLeft")  nc=NAV[Math.max(ci-1, 0)];
              if (e.key==="ArrowDown")  nr=Math.min(row+1, 35);
              if (e.key==="ArrowUp")    nr=Math.max(row-1, 1);
              if (nc!==col||nr!==row) { setSel(`${nc}${nr}`); setSelEnd(null); }
            }
            return;
          }

          if (e.key === "Tab") {
            e.preventDefault();
            const nc = NAV[Math.min(ci+1, NAV.length-1)];
            if (nc !== col) { setSel(`${nc}${row}`); setSelEnd(null); }
            return;
          }

          if ((e.key==="z"||e.key==="Z") && (e.metaKey||e.ctrlKey) && !e.shiftKey) { e.preventDefault(); undo(); return; }
          if (((e.key==="y"||e.key==="Y") && (e.metaKey||e.ctrlKey)) || ((e.key==="z"||e.key==="Z") && (e.metaKey||e.ctrlKey) && e.shiftKey)) { e.preventDefault(); redo(); return; }

          if ((e.key==="c"||e.key==="C") && (e.metaKey||e.ctrlKey)) {
            e.preventDefault();
            const d=dataRef.current, i=inpRef.current;
            const cv = cr => INP.has(cr)
              ? (i[cr]!=null ? String(i[cr]) : "")
              : (d[cr]!=null && !isNaN(d[cr]) ? fmtCell(cr,d[cr]) : "");
            let txt;
            if (selEnd) {
              const r1=Math.min(parseInt(sel.slice(1)),parseInt(selEnd.slice(1)));
              const r2=Math.max(parseInt(sel.slice(1)),parseInt(selEnd.slice(1)));
              const ci1=Math.min(NAV.indexOf(sel[0]),NAV.indexOf(selEnd[0]));
              const ci2=Math.max(NAV.indexOf(sel[0]),NAV.indexOf(selEnd[0]));
              const lines=[];
              for(let r=r1;r<=r2;r++){
                if(BLANKS.has(r)) continue;
                const cells=[];
                for(let ci=ci1;ci<=ci2;ci++) cells.push(cv(`${NAV[ci]}${r}`));
                lines.push(cells.join("\t"));
              }
              txt=lines.join("\n");
            } else {
              txt=cv(sel);
            }
            navigator.clipboard.writeText(txt).catch(() => {
              const el = document.createElement('textarea');
              el.value = txt;
              el.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
              document.body.appendChild(el);
              el.focus(); el.select();
              try { document.execCommand('copy'); } catch(_) {}
              document.body.removeChild(el);
            });
            return;
          }

          // Keys below only apply to input cells
          if (!INP.has(sel)) return;

          if (e.key === "Enter") {
            e.preventDefault();
            startCharRef.current = null;
            explicitEditRef.current = true;
            setEditMode(true);
            return;
          }

          if (e.key === "Delete" || e.key === "Backspace") {
            e.preventDefault();
            if (selEnd) {
              setInpH(p => {
                const n = {...p};
                NAV.forEach(c => ALL_ROWS.forEach(r => {
                  const cr = `${c}${r}`;
                  if (INP.has(cr) && inSelRange(cr, sel, selEnd)) delete n[cr];
                }));
                return n;
              });
            } else {
              clr(sel);
            }
            return;
          }

          // Any printable character enters edit mode pre-filled with that char
          if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            startCharRef.current = e.key;
            explicitEditRef.current = false;
            setEditMode(true);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [sel, editMode, selEnd]);

      const isDisabled = !!sel && (
        FRZ.has(sel) ||
        sel[0] === "A" ||
        BLANKS.has(parseInt(sel.slice(1))) ||
        (!!FDS[sel] && !MCAPEX_CELLS.has(sel) && sel !== "B35")
      );

      return (
        <div style={{fontFamily:"'Inter',ui-sans-serif,sans-serif", background:C.page, width:TOTAL_W, fontSize:13}}>

          <div style={{
            background:C.hdr, color:"#fff",
            display:"flex", alignItems:"center",
            padding:"0 14px", height:G.headerH, boxSizing:"border-box",
          }}>
            <span style={{fontSize:17, fontWeight:700, letterSpacing:"-0.4px", flex:1}}>Buffett Lens</span>
            <div style={{display:"flex", gap:8}}>
              {[["https://www.screener.in/","ti-database","Data"],["https://www.tradingview.com/chart/Fuy7YZyx/","ti-chart-line","Price"]].map(([href,icon,label]) => (
                <a key={label} href={href} target="_blank" rel="noreferrer" style={{
                  textDecoration:"none", color:"#fff",
                  border:"1.5px solid rgba(255,255,255,0.55)", borderRadius:999,
                  padding:"4px 13px", fontSize:12, fontWeight:500,
                  display:"flex", alignItems:"center", gap:5, cursor:"pointer",
                }}><i className={`ti ${icon}`} aria-hidden="true" style={{fontSize:13}} />{label}</a>
              ))}
            </div>
          </div>

          <div style={{
            background: isDisabled ? C.labelCol : "#fff",
            borderBottom:`1px solid ${C.border}`,
            display:"flex", alignItems:"center",
            height:G.fbarH, transition:"background 0.15s",
          }}>
            <div style={{
              width:60, flexShrink:0, borderRight:`1px solid ${C.border}`,
              height:"100%", display:"flex", alignItems:"center",
              padding:`0 ${CP.h}px`, fontWeight:700, fontSize:12,
              color: isDisabled ? "#aaa" : "#444",
              justifyContent:"center",
            }}>{sel || ""}</div>
            <div style={{
              width:30, flexShrink:0, borderRight:`1px solid ${C.border}`,
              height:"100%", display:"flex", alignItems:"center", justifyContent:"center",
              color:"#bbb", fontSize:14, fontStyle:"italic", userSelect:"none",
            }}>fx</div>
            <div
              style={{
                flex:1, height:"100%",
                display:"flex", alignItems:"center",
                padding:`0 ${CP.h}px`,
                color: isDisabled ? "#aaa" : "#222",
                fontSize:12, lineHeight:1,
                overflowX:"auto", whiteSpace:"nowrap",
                boxSizing:"border-box",
                cursor: INP.has(sel) && !editMode ? "text" : "default",
              }}
              onMouseDown={e => { if (e.target.tagName !== "INPUT") e.preventDefault(); }}
              onClick={() => {
                if (INP.has(sel) && !editMode) {
                  startCharRef.current = null;
                  explicitEditRef.current = true;
                  fbarFocusRef.current = true;
                  if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
                  setEditMode(true);
                }
              }}
            >
              {isDisabled
                ? getFormula(sel, data, inp)
                : sel === "B35"
                  ? <B35FormulaBar mult={mult} setMult={setMult} />
                  : MCAPEX_CELLS.has(sel)
                    ? <McapexFormulaBar mcapex={mcapex} setMcapex={setMcapex} col={sel[0]} />
                    : editMode && INP.has(sel)
                      ? <input
                          ref={fbarInputRef}
                          value={draft}
                          onChange={e => setDraft(e.target.value)}
                          onBlur={() => {
                            if (fbarActionRef.current) { fbarActionRef.current = null; return; }
                            if (draft === "") clr(sel);
                            else { const n = parseN(draft); if (!isNaN(n)) upd(sel, n); }
                          }}
                          onKeyDown={e => {
                            if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fbarActionRef.current = "cancel"; setEditMode(false); }
                            if (e.key === "Enter" || e.key === "Tab") {
                              e.preventDefault(); e.stopPropagation();
                              fbarActionRef.current = "commit";
                              if (draft === "") clr(sel); else { const n = parseN(draft); if (!isNaN(n)) upd(sel, n); }
                              setEditMode(false);
                              if (e.key === "Enter") { setSel(`${sel[0]}${Math.min(parseInt(sel.slice(1))+1, 35)}`); setSelEnd(null); }
                              else { const ci=NAV.indexOf(sel[0]); const nc=NAV[Math.min(ci+1,NAV.length-1)]; if (nc!==sel[0]) { setSel(`${nc}${parseInt(sel.slice(1))}`); setSelEnd(null); } }
                            }
                          }}
                          style={{
                            width:"100%", border:"none", outline:"none",
                            background:"transparent", color:"#222",
                            fontSize:12, padding:0, margin:0,
                            fontFamily:"'Inter',ui-sans-serif,sans-serif",
                          }}
                        />
                      : sel ? getFormula(sel, data, inp) : ""
              }
            </div>
          </div>

          <div ref={scrollRef} style={{overflow:"auto", maxHeight:`calc(100vh - ${G.headerH+G.fbarH}px)`}}>
            <Sheet
              data={data} inp={inp} sel={sel} selEnd={selEnd} handleSelect={handleSelect}
              upd={upd} clr={clr}
              editMode={editMode} setEditMode={setEditMode}
              startCharRef={startCharRef} explicitEditRef={explicitEditRef}
              exitEdit={exitEdit} tabFromCell={tabFromCell}
              enterFromCell={enterFromCell} navigateFromCell={navigateFromCell}
              draft={draft} setDraft={setDraft} fbarFocusRef={fbarFocusRef}
            />
          </div>
        </div>
      );
    }

    function Sheet({data, inp, sel, selEnd, handleSelect, upd, clr, editMode, setEditMode, startCharRef, explicitEditRef, exitEdit, tabFromCell, enterFromCell, navigateFromCell, draft, setDraft, fbarFocusRef}) {
      const blankStyle = cr => ({
        background:"#ffffff",
        borderRight:`1px solid ${C.border}`,
        borderBottom:`1px solid ${C.border}`,
        boxShadow: sel===cr ? `inset 0 0 0 2px ${C.selBorder}` : inSelRange(cr,sel,selEnd) ? `inset 0 0 0 100px rgba(219,234,254,0.5)` : "none",
        height:G.blankH, boxSizing:"border-box", padding:0, cursor:"pointer",
      });

      return (
        <table style={{borderCollapse:"separate", borderSpacing:0, tableLayout:"fixed", whiteSpace:"nowrap"}}>
          <colgroup>
            <col style={{width:G.rowNum, minWidth:G.rowNum}} />
            <col style={{width:G.colA,   minWidth:G.colA}} />
            {COLS.map(c => <col key={c} style={{width:G.col, minWidth:G.col}} />)}
          </colgroup>
          <thead>
            <tr>
              <th style={TH_BASE} />
              <th style={{...TH_BASE, fontWeight:sel&&sel[0]==="A"?700:400,background:sel&&sel[0]==="A"?C.selBg:C.colHdr}}>A</th>
              {COLS.map(c => { const ci=NAV.indexOf(c), inCol=sel&&(selEnd?ci>=Math.min(NAV.indexOf(sel[0]),NAV.indexOf(selEnd[0]))&&ci<=Math.max(NAV.indexOf(sel[0]),NAV.indexOf(selEnd[0])):sel[0]===c); return <th key={c} style={{...TH_BASE, fontWeight:inCol?700:400, background:inCol?C.selBg:C.colHdr}}>{c}</th>; })}
            </tr>
          </thead>
          <tbody>
            {ALL_ROWS.map(r => {
              if (BLANKS.has(r)) return (
                <tr key={r}>
                  <td style={{background:"#ffffff", borderRight:`1px solid ${C.border}`, borderBottom:`1px solid ${C.border}`, height:G.blankH, boxSizing:"border-box", padding:0}} />
                  <td style={blankStyle(`A${r}`)} onClick={e => { if (editMode) exitEdit(); handleSelect(`A${r}`, e.shiftKey); }} />
                  {COLS.map(col => <td key={col} style={blankStyle(`${col}${r}`)} onClick={e => { if (editMode) exitEdit(); handleSelect(`${col}${r}`, e.shiftKey); }} />)}
                </tr>
              );
              return (
                <SheetRow key={r} row={r} data={data} inp={inp}
                  sel={sel} selEnd={selEnd} handleSelect={handleSelect}
                  upd={upd} clr={clr}
                  editMode={editMode} setEditMode={setEditMode}
                  startCharRef={startCharRef} explicitEditRef={explicitEditRef}
                  exitEdit={exitEdit} tabFromCell={tabFromCell}
                  enterFromCell={enterFromCell} navigateFromCell={navigateFromCell}
                  draft={draft} setDraft={setDraft} fbarFocusRef={fbarFocusRef} />
              );
            })}
          </tbody>
        </table>
      );
    }

    function SheetRow({row, data, inp, sel, selEnd, handleSelect, upd, clr, editMode, setEditMode, startCharRef, explicitEditRef, exitEdit, tabFromCell, enterFromCell, navigateFromCell, draft, setDraft, fbarFocusRef}) {
      return (
        <tr>
          <td style={{
            background:(()=>{const sr=parseInt(sel.slice(1)),er=selEnd?parseInt(selEnd.slice(1)):sr;return row>=Math.min(sr,er)&&row<=Math.max(sr,er);})()?C.selBg:C.rowNum, color:C.rowNumFg,
            fontSize:11, fontWeight:sel&&parseInt(sel.slice(1))===row?700:400, textAlign:"center",
            padding:`${CP.v}px ${CP.h}px`,
            borderRight:`1px solid ${C.border}`, borderBottom:`1px solid ${C.border}`,
            height:G.rowH, boxSizing:"border-box", userSelect:"none",
          }}>{row}</td>

          <td onClick={e => { if (editMode) exitEdit(); handleSelect(`A${row}`, e.shiftKey); }} style={{
            background:C.labelCol, color:C.labelFg,
            fontSize:12, fontWeight:500,
            padding:`${CP.v}px ${CP.h}px`,
            borderRight:`1px solid ${C.border}`, borderBottom:`1px solid ${C.border}`,
            overflow:"hidden", textOverflow:"ellipsis",
            height:G.rowH, boxSizing:"border-box", userSelect:"none", cursor:"pointer",
            boxShadow: sel===`A${row}` ? `inset 0 0 0 2px ${C.selBorder}` : inSelRange(`A${row}`,sel,selEnd) ? `inset 0 0 0 100px rgba(219,234,254,0.5)` : "none",
          }}>
            <RowLabel row={row} />
          </td>

          {COLS.map(col => (
            <GridCell key={col} cr={`${col}${row}`}
              data={data} inp={inp} sel={sel} selEnd={selEnd} handleSelect={handleSelect}
              upd={upd} clr={clr}
              editMode={editMode} setEditMode={setEditMode}
              startCharRef={startCharRef} explicitEditRef={explicitEditRef}
              exitEdit={exitEdit} tabFromCell={tabFromCell}
              enterFromCell={enterFromCell} navigateFromCell={navigateFromCell}
              draft={draft} setDraft={setDraft} fbarFocusRef={fbarFocusRef} />
          ))}
        </tr>
      );
    }

    function GridCell({cr, data, inp, sel, selEnd, handleSelect, upd, clr, editMode, setEditMode, startCharRef, explicitEditRef, exitEdit, tabFromCell, enterFromCell, navigateFromCell, draft, setDraft, fbarFocusRef}) {
      const isInp  = INP.has(cr),  isFrz  = FRZ.has(cr), isOut  = OUT.has(cr);
      const isLtxt = LTXT.has(cr), isBlue = BLUE.has(cr);
      const isSel     = sel === cr;
      const isInRange = inSelRange(cr, sel, selEnd);
      const isEditing = isSel && editMode;
      const cornerRow = selEnd ? Math.max(parseInt(sel.slice(1)),parseInt(selEnd.slice(1))) : parseInt(sel.slice(1));
      const cornerCI  = selEnd ? Math.max(NAV.indexOf(sel[0]),NAV.indexOf(selEnd[0])) : NAV.indexOf(sel[0]);
      const isCorner  = !!selEnd && isInRange && parseInt(cr.slice(1))===cornerRow && NAV.indexOf(cr[0])===cornerCI;

      let bg, fg, fw=400, ta="right";
      if      (isFrz)  { bg=C.frozen;   fg=C.frozenFg; }
      else if (isBlue) { bg=C.blueCell; fg=C.blueCellFg; fw=600; }
      else if (isOut)  { const os=outStyle(cr,data); bg=os.bg; fg=os.fg; fw=600; }
      else if (isInp)  { bg=C.input; fg=C.inputFg; }
      else if (isLtxt) { bg=C.ltxt; fg=C.ltxtFg; ta="left"; fw=500; }
      else             { bg=C.formula; fg=C.formulaFg; }

      // Selected: thick border. Range: blue tint. Edit mode: handled in ICell.
      const shadow = isSel ? `inset 0 0 0 2px ${C.selBorder}` : isInRange ? `inset 0 0 0 100px rgba(219,234,254,0.5)` : "none";
      const dot = isCorner ? <div style={{position:"absolute",bottom:-4,right:-4,width:8,height:8,borderRadius:"50%",background:C.selBorder,zIndex:10,pointerEvents:"none"}} /> : null;

      const tdBase = {
        borderRight:`1px solid ${C.border}`,
        borderBottom:`1px solid ${C.border}`,
        boxShadow: shadow,
        fontSize:12, fontWeight:fw, textAlign:ta, color:fg,
        height:G.rowH, boxSizing:"border-box",
        overflow:"hidden", verticalAlign:"middle",
      };

      if (isInp) return (
        <td
          style={{...tdBase, background:isBlue?C.blueCell:bg, padding:0, cursor:"pointer", boxShadow:"none", position:"relative", overflow:isCorner?"visible":"hidden"}}
          onClick={e => { if (editMode && !isSel) exitEdit(); handleSelect(cr, e.shiftKey); }}
          onDoubleClick={() => { explicitEditRef.current=true; handleSelect(cr); startCharRef.current=null; setEditMode(true); }}>
          <ICell
            cr={cr} rawVal={inp[cr]} isSel={isSel} isInRange={isInRange} isBlue={isBlue}
            fg={isBlue?C.blueCellFg:C.inputFg}
            bg={isBlue?C.blueCell:C.input}
            upd={upd} clr={clr}
            isEditing={isEditing}
            startCharRef={startCharRef} explicitEditRef={explicitEditRef}
            onExitEdit={exitEdit}
            onTab={() => tabFromCell(cr)}
            onEnter={() => enterFromCell(cr)}
            onArrow={dir => navigateFromCell(cr, dir)}
            draft={draft} setDraft={setDraft} fbarFocusRef={fbarFocusRef}
          />
          {dot}
        </td>
      );

      return (
        <td style={{...tdBase, background:bg, padding:`${CP.v}px ${CP.h}px`, cursor:"pointer", position:"relative", overflow:isCorner?"visible":"hidden"}}
          onClick={e => { if (editMode) exitEdit(); handleSelect(cr, e.shiftKey); }}>
          {isFrz ? null : isLtxt ? LTXT_V[cr] : fmtCell(cr, data[cr])}
          {dot}
        </td>
      );
    }

    function ICell({cr, rawVal, isSel, isInRange, isBlue, fg, bg, upd, clr, isEditing, startCharRef, explicitEditRef, onExitEdit, onTab, onEnter, onArrow, draft, setDraft, fbarFocusRef}) {
      const ref      = useRef(null);
      const modified = useRef(false);

      useEffect(() => {
        if (isEditing && ref.current) {
          const sc = startCharRef.current;
          startCharRef.current = null;
          modified.current = sc !== null;
          setDraft(sc !== null ? sc : (rawVal != null && !isNaN(rawVal) ? String(rawVal) : ""));
          if (!fbarFocusRef.current) {
            ref.current.focus();
            setTimeout(() => {
              if (ref.current) {
                const len = ref.current.value.length;
                ref.current.setSelectionRange(len, len);
              }
            }, 0);
          }
        } else if (!isEditing && document.activeElement === ref.current) {
          ref.current.blur();
        }
      }, [isEditing]);

      const commit = () => {
        if (!modified.current) return;
        modified.current = false;
        if (draft === "") clr(cr);
        else { const n = parseN(draft); if (!isNaN(n)) upd(cr, n); }
      };

      const display = isEditing
        ? draft
        : (rawVal != null && !isNaN(rawVal) ? fmtCell(cr, rawVal) : "");

      return (
        <input
          ref={ref}
          value={display}
          readOnly={!isEditing}
          onChange={e => { if (isEditing) { modified.current = true; setDraft(e.target.value); } }}
          onBlur={commit}
          onKeyDown={e => {
            if (!isEditing) return;
            if (e.key==="Escape")    { e.preventDefault(); e.stopPropagation(); modified.current=false; if(ref.current)ref.current.setSelectionRange(0,0); onExitEdit(); }
            if (e.key==="Enter")     { e.preventDefault(); e.stopPropagation(); if(ref.current)ref.current.setSelectionRange(0,0); commit(); onEnter(); }
            if (e.key==="Tab")       { e.preventDefault(); e.stopPropagation(); if(ref.current)ref.current.setSelectionRange(0,0); commit(); onTab(); }
            if (!explicitEditRef.current && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
              e.preventDefault(); e.stopPropagation(); commit(); onArrow(e.key);
            }
          }}
          style={{
            width:"100%", height:"100%", border:"none", outline:"none",
            background:bg, color:fg, textAlign:"right",
            padding:`${CP.v}px ${CP.h}px`,
            fontSize:12, fontWeight:isBlue?600:400,
            boxSizing:"border-box",
            cursor: isEditing ? "text" : "pointer",
            fontFamily:"'Inter',ui-sans-serif,sans-serif",
            caretColor: isEditing ? "auto" : "transparent",
            userSelect: isEditing ? "auto" : "none",
            boxShadow: isEditing
              ? `inset 0 0 0 2px ${C.selBorder}, inset 0 0 0 6px #bfdbfe`
              : isSel ? `inset 0 0 0 2px ${C.selBorder}` : isInRange ? `inset 0 0 0 100px rgba(219,234,254,0.5)` : "none",
          }}
        />
      );
    }

    function EditableNum({value, onChange, validate}) {
      const ref   = useRef(null);
      const saved = useRef(String(value));
      useEffect(() => {
        if (ref.current) { ref.current.textContent = String(value); saved.current = String(value); }
      }, []);
      return (
        <span
          ref={ref}
          contentEditable
          suppressContentEditableWarning
          spellCheck={false}
          onFocus={() => { saved.current = ref.current.textContent; }}
          onBlur={() => {
            const n = parseInt((ref.current.textContent||"").replace(/\D/g,""));
            if (!isNaN(n) && n > 0 && (!validate || validate(n))) { onChange(n); ref.current.textContent = String(n); saved.current = String(n); }
            else ref.current.textContent = saved.current;
          }}
          onKeyDown={e => {
            if (e.key==="Enter")  { e.preventDefault(); ref.current.blur(); }
            if (e.key==="Escape") { e.preventDefault(); ref.current.textContent = saved.current; ref.current.blur(); }
            if (!/\d/.test(e.key) && !["Backspace","Delete","ArrowLeft","ArrowRight","Home","End"].includes(e.key) && !e.metaKey && !e.ctrlKey) e.preventDefault();
          }}
          style={{ outline:"none", cursor:"text" }}
        />
      );
    }

    const B35_PRE = "=NPV(AVERAGE(C26:F26)*";
    const B35_SUF = "%,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^1,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^2,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^3,AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^4,(AVERAGE(C23:F23)*(1+AVERAGE(C26:F26))^5)+((AVERAGE(C21:F21)*(1+AVERAGE(C26:F26))^5)*(1/AVERAGE(C25:F25))))";

    function B35FormulaBar({mult, setMult}) {
      return (
        <span style={{fontSize:12, color:"#222", whiteSpace:"nowrap"}}>
          {B35_PRE}
          <EditableNum value={mult} onChange={setMult} />
          {B35_SUF}
        </span>
      );
    }

    function McapexFormulaBar({mcapex, setMcapex, col}) {
      return (
        <span style={{fontSize:12, color:"#222", whiteSpace:"nowrap"}}>
          {"="}
          <EditableNum value={mcapex} onChange={setMcapex} validate={n => n <= 100} />
          {"%*" + col + "7"}
        </span>
      );
    }

    function DesktopGuard({children}) {
      const [narrow, setNarrow] = useState(window.innerWidth < TOTAL_W + 40);
      useEffect(() => {
        const h = () => setNarrow(window.innerWidth < TOTAL_W + 40);
        window.addEventListener("resize", h);
        return () => window.removeEventListener("resize", h);
      }, []);
      if (narrow) return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"'Inter',ui-sans-serif,sans-serif",fontSize:16,color:"#555",background:"#f0f0f0"}}>
          Accessible only on a desktop
        </div>
      );
      return children;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<DesktopGuard><App /></DesktopGuard>);
  </script>
</body>
</html>
